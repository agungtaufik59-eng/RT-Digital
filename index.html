<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RT Warga Digital</title>

  <!-- PWA -->
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976D2">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RT Warga">

  <!-- Styles -->
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- ============ BOOT LOADER ============ -->
  <div id="bootLoader" style="position:fixed;inset:0;background:linear-gradient(135deg,#1976D2,#0D47A1);
       display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:16px;
       z-index:999999;transition:opacity .3s">
    <div style="width:72px;height:72px;background:rgba(255,255,255,.18);border-radius:20px;
         display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;
         letter-spacing:-1px;color:#fff">RT</div>
    <div style="font-size:18px;font-weight:700;letter-spacing:-0.3px">RT Warga Digital</div>
    <div style="font-size:12px;opacity:.75;margin-top:-10px">Sistem Informasi Warga</div>
    <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,.25);
         border-top-color:#fff;border-radius:50%;animation:bootSpin .8s linear infinite;margin-top:6px"></div>
    <style>@keyframes bootSpin{to{transform:rotate(360deg)}}</style>
  </div>

  <!-- ===== PHONE FRAME (aktif hanya di desktop) ===== -->
  <div id="phoneWrapper">
    <div class="phone-notch"></div>

    <!-- ============ LOGIN ============ -->
    <div id="loginScreen" class="screen">
      <div class="login-box">
        <div class="logo">🏘️</div>
        <h1>RT Warga Digital</h1>
        <p class="subtitle">Sistem Informasi Warga</p>
        <div class="field">
          <label>Nomor HP</label>
          <input type="tel" id="loginPhone" placeholder="08xxxxxxxxxx" autocomplete="tel">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPwd" placeholder="••••••••">
        </div>
        <button class="btn primary block" id="btnLogin">Masuk</button>
        <p class="hint">Perumahan <b>KAMILAN CIRACAS PERMAI</b>
      </div>
    </div>

    <!-- ============ APP ============ -->
    <div id="appScreen" class="screen">
      <header class="app-bar">
        <div class="app-bar-title">
          <span id="pageTitle">Beranda</span>
          <span id="rtLabel" class="rt-label"></span>
        </div>
        <button class="icon-btn" id="btnRefresh" title="Muat ulang">⟳</button>
      </header>

      <!-- BANNER: aplikasi sedang memuat (dengan progress) -->
      <div id="prefetchBanner" class="prefetch-banner hidden">
        <div class="pf-info">
          <div class="pf-spinner"></div>
          <span class="pf-text">Aplikasi sedang memuat data...</span>
          <span class="pf-pct">0%</span>
        </div>
        <div class="pf-progress">
          <div class="pf-progress-bar" id="pfBar" style="width:0%"></div>
        </div>
      </div>

      <main id="mainContent"></main>

      <nav class="bottom-nav">
        <button class="nav-btn active" data-page="home">
          <span class="nav-icon">🏠</span><span>Beranda</span>
        </button>
        <button class="nav-btn" data-page="iuran">
          <span class="nav-icon">💰</span><span>Iuran</span>
        </button>
        <button class="nav-btn" data-page="surat">
          <span class="nav-icon">📄</span><span>Surat</span>
        </button>
        <button class="nav-btn" data-page="profil">
          <span class="nav-icon">👤</span><span>Profil</span>
        </button>
      </nav>
    </div>

    <!-- ============ OVERLAYS ============ -->
    <div id="loading" class="loading hidden"><div class="spinner"></div></div>
    <div id="toast" class="toast"></div>

    <!-- ============ MODAL ============ -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-head">
          <h3 id="modalTitle">Form</h3>
          <button class="icon-btn" id="modalClose">✕</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <!-- ============ CONFIRM DIALOG ============ -->
    <div id="confirmDialog" class="cfm-overlay hidden">
      <div class="cfm-box">
        <div class="cfm-icon" id="cfmIcon">❓</div>
        <h3 class="cfm-title" id="cfmTitle">Konfirmasi</h3>
        <p class="cfm-message" id="cfmMessage">Apakah Anda yakin?</p>
        <div class="cfm-actions">
          <button class="cfm-btn cancel" id="cfmBtnCancel">Batal</button>
          <button class="cfm-btn confirm" id="cfmBtnConfirm">Oke</button>
        </div>
      </div>
    </div>

    <!-- ============ PROMPT DIALOG ============ -->
    <div id="promptDialog" class="cfm-overlay hidden">
      <div class="cfm-box">
        <div class="cfm-icon" id="prmIcon">✏️</div>
        <h3 class="cfm-title" id="prmTitle">Input</h3>
        <p class="cfm-message" id="prmMessage">Masukkan nilai:</p>
        <input type="text" class="cfm-input" id="prmInput" placeholder="">
        <div class="cfm-actions">
          <button class="cfm-btn cancel" id="prmBtnCancel">Batal</button>
          <button class="cfm-btn confirm" id="prmBtnConfirm">Oke</button>
        </div>
      </div>
    </div>

    <!-- ============ ALERT DIALOG ============ -->
    <div id="alertDialog" class="cfm-overlay hidden">
      <div class="cfm-box">
        <div class="cfm-icon" id="altIcon">ℹ️</div>
        <h3 class="cfm-title" id="altTitle">Info</h3>
        <p class="cfm-message" id="altMessage"></p>
        <div class="cfm-actions single">
          <button class="cfm-btn confirm" id="altBtnOk">Oke</button>
        </div>
      </div>
    </div>

    <!-- ============ PROCESS DIALOG ============ -->
    <div id="processDialog" class="cfm-overlay hidden">
      <div class="cfm-box process-box">
        <div class="process-icon" id="processIcon">
          <div class="process-spinner"></div>
        </div>
        <h3 class="cfm-title" id="processTitle">Memproses...</h3>
        <p class="cfm-message" id="processMessage">Mohon tunggu sebentar</p>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
